# Coverage checks on pull requests (reports uploaded by .github/workflows/ci.yml: core:engine,
# flag "engine", and core:data, flag "data"; the feature modules are not measured yet).
#
# - patch:   at least 90% of the lines a pull request adds or changes must be covered by tests,
#            so a new feature or fix ships with its tests.
# - project: per module (flag), the coverage may not drop by more than 0.5% from the base
#            commit. Per flag, so adding a module that is still less covered than the others
#            does not read as a drop.
#
# Codecov posts these as status checks only with the Codecov GitHub App installed on the
# repository; they block a merge only when "codecov/patch" and "codecov/project/*" are required
# status checks in the branch protection for master.
codecov:
  require_ci_to_pass: true

flags:
  engine:
    paths:
      - core/engine/
    carryforward: true
  data:
    paths:
      - core/data/
    carryforward: true

coverage:
  precision: 1
  round: down
  status:
    patch:
      default:
        target: 90%
    project:
      engine:
        flags:
          - engine
        target: auto
        threshold: 0.5%
      data:
        flags:
          - data
        target: auto
        threshold: 0.5%

comment:
  layout: "diff, flags, files"
  require_changes: false
